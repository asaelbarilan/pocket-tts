# Hebrew with the COMBINED semantic conditioning mode (SEMANTIC_CONDITIONING.md): both frozen
# encoders, DictaBERT-large and RenikudPlus, are fused into the text prefix through one learned
# gate per encoder (`flow_lm.semantic_conditioners`, a list of two). This is hebrew.yaml plus
# that section; every key is written out at its default. The singular `semantic_conditioner`
# stays valid for one encoder (hebrew_semantic.yaml, hebrew_semantic_renikud.yaml); naming both
# keys is an error. Experimental, not a Kyutai release. Inference needs
# `pip install 'pocket-tts[semantic,semantic-renikud]'` and downloads both pinned encoders on
# first load. A model trained this way must be run with this exact pair, in this order: its
# fusion weights are tied to them (checkpoints record both and refuse to load across them).
#
# Hebrew. Copied from english.yaml with exactly two changes, both in
# flow_lm.lookup_table: `tokenizer_path` points at the Hebrew SentencePiece model from
# hebrew_training/train_tokenizer.py, and `n_bins` must equal that run's --vocab-size.
#
# `weights_path` is deliberately left pointing at the released English model: training/args.py
# uses it for the Mimi codec ALWAYS, and for the FlowLM only when start_from_pretrained is
# true. Both training configs set start_from_pretrained: false, so the FlowLM is fresh and
# only Mimi is borrowed -- which is what you want, since Mimi is a language-agnostic codec.
#
# The 24-layer teacher is this same file plus `flow_lm.transformer.num_layers: 24`, applied
# as a model_overrides entry in lsd_scratch.yaml. Do not fork a second config for it.

weights_path: hf://kyutai/pocket-tts/languages/english/model.safetensors@39592ff23c9ef80098bb74895d104c26275fe2c9
weights_path_without_voice_cloning: hf://kyutai/pocket-tts-without-voice-cloning/languages/english/model.safetensors@d29db7978e464fb90cb3359ee0c69a273b9142cc
# Human evals preferred this model at 0.3 (equal WER/similarity/speech rate).
default_temperature: 0.3

# Training text and the tokenizer corpus had curly quotes, Unicode dashes and invisible marks
# folded to plain characters; fold the prompt the same way (pocket_tts/utils/text_fold.py).
fold_text: true


flow_lm:
  insert_bos_before_voice: true
  dtype: float32
  flow:
    depth: 6
    dim: 512
  transformer:
    d_model: 1024
    hidden_scale: 4
    max_period: 10000
    num_heads: 16
    num_layers: 6
  lookup_table:
    dim: 1024
    n_bins: 8000  # inference asserts this equals the tokenizer's size; training reads it from the file
    tokenizer: sentencepiece
    tokenizer_path: tokenizers/hebrew.model  # <- train_tokenizer.py output
  semantic_conditioners:  # the order is the order of the fusion's branches: do not swap them
    - encoder: dictabert
      model_name: dicta-il/dictabert-large
      revision: a972ffb612c03bcfb128f10f5ef4462f7adb9844  # pinned; change only on purpose
      hidden_size: 1024
      first_layer: 8  # 1-based, inclusive; DictaBERT-large has 24 layers
      last_layer: 20
      max_tokens: 512  # longer texts are encoded in independent windows
      gate: scalar  # `gate` and `gate_hidden` belong to the whole fusion: both entries must agree
      gate_hidden: 256
    - encoder: renikud_plus
      model_name: notmax123/RenikudPlus
      revision: 679c56ca449d41873fb8ff7711ddf7563d28198f  # pinned; change only on purpose
      filename: model.onnx  # fp32. Never the int8 file: train = inference
      hidden_size: 1024
      first_layer: 8
      last_layer: 20
      max_tokens: 2048
      gate: scalar
      gate_hidden: 256
      onnx_threads: 1  # ONNX Runtime intra-op threads, as torch.set_num_threads(1)
      onnx_provider: cuda  # set cpu explicitly for CPU-only inference/deployment
  #weights_path: final.safetensors

mimi:
  dtype: float32
  sample_rate: 24000
  inner_dim: 32
  outer_dim: 512
  channels: 1
  frame_rate: 12.5
  seanet:
    dimension: 512
    channels: 1
    n_filters: 64
    n_residual_layers: 1
    ratios:
    - 6
    - 5
    - 4
    kernel_size: 7
    residual_kernel_size: 3
    last_kernel_size: 3
    dilation_base: 2
    pad_mode: constant
    compress: 2
  transformer:
    d_model: 512
    num_heads: 8
    num_layers: 2
    layer_scale: 0.01
    context: 250
    dim_feedforward: 2048
    input_dimension: 512
    output_dimensions:
    - 512
  quantizer:
    dimension: 32
    output_dimension: 512
  #weights_path: codec.safetensors

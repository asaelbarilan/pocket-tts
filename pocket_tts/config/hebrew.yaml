# Hebrew. Copied from english.yaml with exactly two changes, both in
# flow_lm.lookup_table: `tokenizer_path` points at the Hebrew SentencePiece model from
# training/scripts/train_tokenizer.py, and `n_bins` must equal that run's --vocab-size.
#
# `weights_path` is deliberately left pointing at the released English model: training/args.py
# uses it for the Mimi codec ALWAYS, and for the FlowLM only when start_from_pretrained is
# true. Both training configs set start_from_pretrained: false, so the FlowLM is fresh and
# only Mimi is borrowed -- which is what you want, since Mimi is a language-agnostic codec.
#
# The 24-layer teacher is this same file plus `flow_lm.transformer.num_layers: 24`, applied
# as a model_overrides entry in lsd_scratch.yaml. Do not fork a second config for it.

weights_path: hf://kyutai/pocket-tts/languages/english/model.safetensors@39592ff23c9ef80098bb74895d104c26275fe2c9
weights_path_without_voice_cloning: hf://kyutai/pocket-tts-without-voice-cloning/languages/english/model.safetensors@d29db7978e464fb90cb3359ee0c69a273b9142cc
# Human evals preferred this model at 0.3 (equal WER/similarity/speech rate).
default_temperature: 0.3


flow_lm:
  insert_bos_before_voice: true
  dtype: float32
  flow:
    depth: 6
    dim: 512
  transformer:
    d_model: 1024
    hidden_scale: 4
    max_period: 10000
    num_heads: 16
    num_layers: 6
  lookup_table:
    dim: 1024
    n_bins: 4000
    tokenizer: sentencepiece
    tokenizer_path: tokenizers/hebrew.model  # <- train_tokenizer.py output
  #weights_path: final.safetensors

mimi:
  dtype: float32
  sample_rate: 24000
  inner_dim: 32
  outer_dim: 512
  channels: 1
  frame_rate: 12.5
  seanet:
    dimension: 512
    channels: 1
    n_filters: 64
    n_residual_layers: 1
    ratios:
    - 6
    - 5
    - 4
    kernel_size: 7
    residual_kernel_size: 3
    last_kernel_size: 3
    dilation_base: 2
    pad_mode: constant
    compress: 2
  transformer:
    d_model: 512
    num_heads: 8
    num_layers: 2
    layer_scale: 0.01
    context: 250
    dim_feedforward: 2048
    input_dimension: 512
    output_dimensions:
    - 512
  quantizer:
    dimension: 32
    output_dimension: 512
  #weights_path: codec.safetensors

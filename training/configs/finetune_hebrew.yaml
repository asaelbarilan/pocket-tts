# Hebrew finetune of the released 24-layer teacher. Copied from finetune_language.yaml;
# only the four paths below differ, every training parameter is upstream's. Kyutai measured
# this shape on 976h of Czech: 12% WER by 10k steps where a scratch run was still at 46%,
# both settling at 10-12%.
#
# Run:  uv run torchrun --nproc-per-node 8 training/train.py training/configs/finetune_hebrew.yaml
#
# Note optim.schedule is `constant` here, not the `cosine` scratch.yaml uses. Leave it.

# Finetune a released model into a new language: on 976h of Czech this hit 12%
# WER by 10k steps where a scratch run was still at 46%, and both settled around
# 10-12%. Keep lr at 2e-4: the text embedding starts random, so the backbone has
# to move with it.
model_config: pocket_tts/config/english_2026-04_24l.yaml
model_overrides:
  # The sentencepiece model you fitted on your transcripts. n_bins already
  # matches train_tokenizer.py's default vocab size, so it needs no override.
  flow_lm.lookup_table.tokenizer_path: tokenizers/hebrew.model
start_from_pretrained: true
reset_text_embedding: true  # the tokenizer below is not the one these weights were trained with

data:
  train_jsonl: data/hebrew_official/train_aligned.jsonl
  valid_jsonl: data/hebrew_official/valid_aligned.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 5.0

flow:
  type: lsd
  kwargs: {}

flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 2e-4
  schedule: constant
  warmup_steps: 1000

run_dir: runs/finetune_hebrew
batch_size: 64
grad_accum_steps: 1
max_steps: 250000  # WER plateaus by ~15k; the rest is acoustic quality
stats_ema_steps: 1000
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
ckpt_freq: 2500
# Upstream keeps 3. At ckpt_freq 2500 that is only the last 7500 steps, and this config's
# own comment says WER plateaus by ~15k -- so the checkpoint you want would be deleted long
# before the run ends. On the earlier Hebrew run the best-sounding checkpoint was step 8000.
# 40 covers the first 100k steps at roughly 2.5 GB each (the released 24-layer file is
# 1.24 GB, and a .pt carries raw plus EMA weights); drop it if disk is tight, never to 3.
num_ckpt_keep: 40
# Upstream default is 10000, which on a run that plateaus by 15k gives samples at 10k and
# 20k only. Match valid_freq so there is something to listen to and to score.
sample_freq: 2500
sample_cfg_coef: 2.0

# The trainer synthesizes exactly these every sample_freq steps. args.py defaults them to
# English, which through a Hebrew tokenizer produces samples nobody can judge or score.
sample_sentences:
  - "אדוני היושב ראש, אני מבקש להעלות את הנושא לסדר היום."
  - "חברי הכנסת הנכבדים, מדובר בהחלטה משמעותית עבור אזרחי המדינה."
  - "תודה רבה, אני מסיים כאן את דבריי."

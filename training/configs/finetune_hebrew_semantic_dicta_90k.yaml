# EXPERIMENTAL: 50,000-step five-dataset curriculum with DictaBERT semantic conditioning.
# Local extension, not Kyutai's released training recipe (SEMANTIC_CONDITIONING.md).
# Same semantic setup as finetune_hebrew_multi_1_semantic_test.yaml, with the full
# six-phase curriculum from finetune_hebrew_multi_1.yaml. That source totals 55K;
# shorten only its final phase from 10K to 5K to make this run exactly 50K.
# Starts from English pretrained weights with a fresh Hebrew text embedding,
# NOT from the four-step smoke checkpoint or an existing Hebrew export.
#
# Run: NCCL_P2P_DISABLE=1 uv run torchrun --standalone --nproc-per-node 8 -m training.train training/configs/finetune_hebrew_multi_1_semantic_50k.yaml
model_config: pocket_tts/config/english_2026-04_24l.yaml
model_overrides:
  flow_lm.lookup_table.tokenizer_path: artifacts/tokenizer-he-en-niqqud/selected/tokenizer.model
start_from_pretrained: true
reset_text_embedding: true

# DictaBERT stays frozen; the backbone and semantic fusion are trainable.
semantic_conditioner:
  model_name: dicta-il/dictabert-large
  revision: a972ffb612c03bcfb128f10f5ef4462f7adb9844
  hidden_size: 1024
  first_layer: 8
  last_layer: 20
  gate: scalar
  gate_hidden: 256
  max_tokens: 512
semantic_lr_scale: 3.0

data:
  datasets:
    committee:
      train_jsonl: /mlspeech/hebrew/pockettts-data/committee/train_aligned.jsonl
      valid_jsonl: /mlspeech/hebrew/pockettts-data/committee/valid_aligned.jsonl
      valid_weight: 0.45
    plenum:
      train_jsonl: /mlspeech/hebrew/pockettts-data/plenum/train_aligned.jsonl
      valid_jsonl: /mlspeech/hebrew/pockettts-data/plenum/valid_aligned.jsonl
      valid_weight: 0.25
    recital:
      train_jsonl: /mlspeech/hebrew/pockettts-data/recital/train_aligned.jsonl
      valid_jsonl: /mlspeech/hebrew/pockettts-data/recital/valid_aligned.jsonl
      valid_weight: 0.15
    hifitts2:
      train_jsonl: /mlspeech/hebrew/pockettts-data/hifitts2/train.jsonl
      valid_jsonl: /mlspeech/hebrew/pockettts-data/hifitts2/valid.jsonl
      valid_weight: 0.10
    libritts_r:
      train_jsonl: /mlspeech/hebrew/pockettts-data/libritts_r/train.jsonl
      valid_jsonl: /mlspeech/hebrew/pockettts-data/libritts_r/valid.jsonl
      valid_weight: 0.05
  # Phase lengths: 5K + 20K + 5K + 5K + 10K + 5K = 50K optimizer steps.
  curriculum:
    - steps: 5000
      mix: {committee: 0.35, plenum: 0.30, recital: 0.10, hifitts2: 0.20, libritts_r: 0.05}
    - steps: 20000
      mix: {committee: 0.62, plenum: 0.35, recital: 0.0, hifitts2: 0.02, libritts_r: 0.01}
    - steps: 5000
      mix: {committee: 0.50, plenum: 0.30, recital: 0.10, hifitts2: 0.05, libritts_r: 0.05}
    - steps: 5000
      mix: {committee: 0.30, plenum: 0.20, recital: 0.20, hifitts2: 0.15, libritts_r: 0.15}
    - steps: 10000
      mix: {committee: 0.62, plenum: 0.35, recital: 0.0, hifitts2: 0.02, libritts_r: 0.01}
    - steps: 5000
      mix: {committee: 0.45, plenum: 0.35, recital: 0.1, hifitts2: 0.05, libritts_r: 0.05}
    - steps: 40000
      mix: {committee: 0.55, plenum: 0.4, recital: 0.1, hifitts2: 0.03, libritts_r: 0.01}
  curriculum_checkpoint_at_phase_end: true
  max_duration_sec: 30.0
  max_voice_prompt_sec: 5.0
  alt_words_sample_prob: 1
  alt_word_swap_prob: 0.7
  nikud_word_prob: 0.3

flow:
  type: lsd
  kwargs: {}

flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 2e-4
  schedule: cosine
  # Restore the original curriculum's warmup for a long run.
  warmup_steps: 1000
  lr_min_ratio: 0.1

# Keep the uncompiled semantic path exercised by the real eight-GPU smoke test.
compile: false

run_dir: runs/finetune_hebrew_multi_1_semantic_50k
# 8 GPUs x 8 samples = effective batch 64.
batch_size: 8
grad_accum_steps: 1
# Inferred from the curriculum; explicitly pin it to catch an accidental phase edit.
stats_ema_steps: 1000
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
ckpt_freq: 2500
# Retain all 50 snapshots for intermediate quality comparisons.
num_ckpt_keep: 50
sample_freq: 2500
sample_cfg_coef: 2.0

sample_sentences:
  - "אדוני היושב ראש, אני מבקש להעלות את 200 הנושאים לסדר היום."
  - "חברי הכנסת הנכבדים, מדובר בהחלטה משמעותית עבור אזרחי המדינה."
  - "הוא עבד ב-Microsoft לפני שהצטרף לצוות הפיתוח."
  - "אֲנִי רוֹצָה לָלֶכֶת הַבַּיְתָה, תּוֹדָה רַבָּה."
  - "תודה רבה, אני מסיים כאן את דבריי."
  - "למה בעצם אנחנו צריכים ללמוד היסטוריה אם בסוף אנחנו חוזרים על אותן טעויות שוב ושוב?"
  - "הילדה רצה הביתה כי התחיל לרדת גשם."
  - "הוא רצה ללכת הביתה אבל נשאר עד הסוף."
  - "הספר מונח על השולחן בספרייה."
  - "הספר של השכונה פתח מספרה חדשה."
  - "The quick brown fox jumps over the lazy dog."

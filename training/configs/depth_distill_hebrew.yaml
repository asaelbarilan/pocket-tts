# Hebrew depth distillation. Copied from depth_distill.yaml; only the configs, the
# tokenizer overrides and the teacher checkpoint differ. Every training parameter is
# upstream's -- note batch_size 64 in one pass and no flow_batch_multiplier, since the flow
# loss never runs in distill mode.
#
# The teacher is YOUR finetune run, not a released model. Point distill_teacher_weights at
# the checkpoint runs/finetune_hebrew/ actually produced before launching this.
#
# Run:  uv run torchrun --nproc-per-node 8 training/train.py training/configs/depth_distill_hebrew.yaml

# Depth distillation: a 6-layer student learns the backbone activations of a
# trained 24-layer teacher. Same d_model, so the flow head and all non-backbone
# weights are copied from the teacher and the head stays frozen.
#
# distill_cfg_coef 2.0 bakes guidance in (the README's parity recipe);
# 1.0 = pure depth distillation.
model_config: pocket_tts/config/english.yaml   # 6-layer student
model_overrides:
  flow_lm.lookup_table.tokenizer_path: tokenizers/hebrew.model
start_from_pretrained: false
distill_cfg_coef: 2.0
# The teacher config must match what finetune_hebrew.yaml trained: the 24-layer model
# with the Hebrew tokenizer. english_2026-04_24l.yaml is already 24 layers, so no
# num_layers override is needed here.
distill_teacher_config: pocket_tts/config/english_2026-04_24l.yaml
distill_teacher_overrides:
  flow_lm.lookup_table.tokenizer_path: tokenizers/hebrew.model
distill_teacher_weights: runs/finetune_hebrew/checkpoint_00250000.pt

data:
  train_jsonl: data/hebrew_official/train_aligned.jsonl
  valid_jsonl: data/hebrew_official/valid_aligned.jsonl

flow:
  type: lsd
  kwargs: {}

# No CFG dropout: the teacher's targets are always computed fully-conditioned
# (both z_cond and z_null come from dropout=False passes), and the student is
# never run with a null branch at inference. Dropping conditioning here would
# ask the student to predict the conditioned target from a null input.
text_dropout: 0.0
voice_dropout: 0.0

optim:
  lr: 4e-4  # screened {1,2,4}e-4 on full mini-cosines: 4e-4 clearly best
  schedule: cosine
  warmup_steps: 1000

run_dir: runs/depth_distill_hebrew
batch_size: 64
grad_accum_steps: 1
max_steps: 200000  # WER is at parity by ~50k; sim and UTMOS climb until ~150k
ema_decay: 0.9999
log_freq: 50
valid_freq: 2500
ckpt_freq: 2500
num_ckpt_keep: 999

# The trainer synthesizes exactly these every sample_freq steps. args.py defaults them to
# English, which through a Hebrew tokenizer produces samples nobody can judge or score.
sample_sentences:
  - "אדוני היושב ראש, אני מבקש להעלות את הנושא לסדר היום."
  - "חברי הכנסת הנכבדים, מדובר בהחלטה משמעותית עבור אזרחי המדינה."
  - "תודה רבה, אני מסיים כאן את דבריי."

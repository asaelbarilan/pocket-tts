<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dataloader preview</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main x-data="preview()" x-init="init()" x-cloak>
  <h1>Dataloader preview</h1>
  <div class="sub" x-show="cfg">
    <span x-text="cfg?.config"></span> ·
    <span x-text="cfg?.sample_rate + ' Hz'"></span> ·
    tokenizer <span x-text="cfg?.tokenizer"></span>
  </div>

  <div class="error" x-show="fatal" x-text="fatal"></div>

  <template x-if="cfg">
    <div>
      <section class="card">
        <div class="row">
          <label>Set
            <span class="seg">
              <button :class="{on: split==='train'}" @click="split='train'; pickDataset()">train</button>
              <button :class="{on: split==='valid'}" @click="split='valid'; pickDataset()">eval</button>
            </span>
          </label>
          <label>Phase
            <select x-model.number="phase" @change="pickDataset()">
              <template x-for="p in cfg.phases" :key="p.index">
                <option :value="p.index" x-text="phaseLabel(p)"></option>
              </template>
            </select>
          </label>
          <label>Dataset
            <select x-model="dataset">
              <option value="">all in the phase mix</option>
              <template x-for="name in datasetOptions" :key="name">
                <option :value="name" x-text="name"></option>
              </template>
            </select>
          </label>
        </div>
        <div style="margin-top:8px">
          <span class="sub">drawn from:</span>
          <template x-for="[name, share] in effectiveMix" :key="name">
            <span class="chip" x-text="name + ' ' + (share * 100).toFixed(1).replace(/\.0$/, '') + '%'"></span>
          </template>
          <span class="hint" x-show="effectiveMix.length === 0">no <span x-text="split === 'train' ? 'train' : 'validation'"></span> manifest for this selection</span>
        </div>

        <details class="params" :open="paramsOpen" @toggle="paramsOpen = $event.target.open">
          <summary>Loader parameters <span class="sub">(<span x-text="split === 'train' ? 'train' : 'eval'"></span>; changing any reloads the loader)</span></summary>
          <div class="row" style="margin-top:10px">
            <label>seed <input type="number" step="1" x-model.number="p.seed"></label>
            <label>batch size <input type="number" min="1" max="64" step="1" x-model.number="p.batch_size"></label>
            <label>max duration (s) <input type="number" min="0.1" step="any" x-model.number="p.max_duration_sec"></label>
            <label>max voice prompt (s) <input type="number" step="any" x-model.number="p.max_voice_prompt_sec"></label>
            <label title="Random subset of each manifest given to the loader; 0 = the whole manifest (the loader reads all of it into memory)">rows per manifest (0 = all) <input type="number" min="0" step="1000" x-model.number="p.max_rows"></label>
            <label x-show="p.max_rows > 0">row sample seed <input type="number" step="1" x-model.number="p.sample_seed"></label>
          </div>
          <div class="hint" style="margin-top:6px" x-show="bigManifest && !p.max_rows">
            These manifests total <span x-text="fmtBytes(manifestBytes)"></span>. The loader reads a
            whole manifest into memory before the first batch (and again on every reload): set
            “rows per manifest” to work on a random subset.
          </div>
          <div class="sub" style="margin-top:6px" x-show="manifestBytes">
            manifest size for this selection: <span x-text="fmtBytes(manifestBytes)"></span>
          </div>
          <div class="row" style="margin-top:10px">
            <label>alternates: sample prob <input type="number" min="0" max="1" step="0.05" x-model.number="p.alt_words_sample_prob"></label>
            <label>alternates: swap prob <input type="number" min="0" max="1" step="0.05" x-model.number="p.alt_word_swap_prob"></label>
            <label>niqqud: word prob <input type="number" min="0" max="1" step="0.05" x-model.number="p.nikud_word_prob"></label>
            <label class="inline"><input type="checkbox" x-model="p.shuffle"> shuffle</label>
            <label class="inline" title="Validation mode: every random choice for a row depends only on (seed, path, start)"><input type="checkbox" x-model="p.fixed_draws"> fixed draws</label>
            <button @click="resetParams()">Reset to config</button>
          </div>
        </details>
      </section>

      <section class="card">
        <div class="row">
          <label>Skip batches first
            <input type="number" min="0" max="10000" step="1" x-model.number="skip">
          </label>
          <button class="primary" :disabled="loading" @click="next(false)"
                  x-text="loading ? 'Loading…' : (dirty || !batch ? 'Load batch' : 'Next batch')"></button>
          <button :disabled="loading" @click="next(true)" title="Rebuild the loaders and start from the beginning">Restart</button>
          <span class="hint" x-show="dirty && batch">Selection changed: the next batch reloads the loader from the start.</span>
        </div>
        <div class="status" x-show="batch">
          Batch #<span x-text="batch?.number"></span> from <b x-text="batch?.dataset"></b>
          <span x-show="batch?.skipped"> · skipped <span x-text="batch?.skipped"></span></span>
          <span x-show="batch?.reloaded"> · loader (re)built</span>
          · <span x-text="batch?.elapsed_ms"></span> ms
          <template x-for="[name, n] in Object.entries(batch?.status.batches_drawn ?? {})" :key="name">
            <span> · <span x-text="name"></span>: <span x-text="n"></span> batches,
              <span x-text="batch.status.rows[name]"></span> rows<span
                x-show="batch.status.sampled_from_bytes[name]"> (sampled, manifest
                <span x-text="fmtBytes(batch.status.sampled_from_bytes[name])"></span>)</span>,
              epoch <span x-text="(batch.status.epochs[name] ?? 0).toFixed(2)"></span><span
                x-show="batch.status.unreadable_skipped[name]" class="hint">,
                <span x-text="batch.status.unreadable_skipped[name]"></span> unreadable skipped</span></span>
          </template>
        </div>
      </section>

      <div class="error" x-show="error" x-text="error"></div>

      <template x-for="s in (batch?.samples ?? [])" :key="batch.id + ':' + s.index">
        <section class="card sample">
          <h3>
            #<span x-text="s.index + 1"></span>
            <span class="chip" x-text="batch.dataset"></span>
            <span class="chip" x-text="s.token_ids.length + ' tokens'"></span>
            <span class="chip aug" x-show="s.augmented">alternates/niqqud draw</span>
            <span class="chip" x-show="!s.has_words">no alignment</span>
            <span class="chip" x-show="s.has_alt_words">has alternates</span>
            <span class="chip" x-show="s.has_nikud">has niqqud</span>
          </h3>
          <div class="text" dir="rtl" x-text="s.text"></div>
          <div class="audio">
            <div><span>prompt · <span x-text="s.prompt_sec.toFixed(2)"></span> s</span>
              <audio controls preload="auto" :id="'p' + s.index" :src="s.prompt_url"></audio></div>
            <div><span>target · <span x-text="s.target_sec.toFixed(2)"></span> s</span>
              <audio controls preload="auto" :id="'t' + s.index" :src="s.target_url"></audio></div>
            <button @click="playBoth(s.index)">▶ prompt, then target</button>
          </div>
          <details>
            <summary class="meta">source row &amp; tokens</summary>
            <div class="meta" style="margin:6px 0"><span x-text="s.path"></span>
              (start <span x-text="s.start"></span> s, row <span x-text="s.row_duration"></span> s)</div>
            <div class="text small" dir="rtl" x-text="s.transcript"></div>
            <div class="meta" style="margin-top:6px">
              tokenizer pieces, alternating tint = piece boundary (hover: id and code points).
              <b x-show="markOnly(s) > 0"><span x-text="markOnly(s)"></span> piece(s) are a diacritic alone, cut from their letter.</b>
            </div>
            <div class="pieces" dir="rtl"><template x-for="(piece, i) in s.pieces" :key="i"><span :class="i % 2 ? 'odd' : 'even'" :title="'id ' + s.token_ids[i] + ' · ' + codepoints(piece)" x-text="piece"></span></template></div>
          </details>
        </section>
      </template>
    </div>
  </template>
</main>

<script>
// Alpine state is a Proxy, which structuredClone cannot copy.
const clone = (value) => JSON.parse(JSON.stringify(value));

function preview() {
  return {
    cfg: null, fatal: '', error: '',
    split: 'train', phase: 0, dataset: '', skip: 0,
    params: {train: {}, valid: {}}, paramsOpen: false,
    batch: null, loading: false, loadedSpec: null,

    async init() {
      try {
        const r = await fetch('/api/config');
        if (!r.ok) throw new Error(await r.text());
        this.cfg = await r.json();
        this.params = clone(this.cfg.defaults);
      } catch (e) { this.fatal = 'Could not load the config: ' + e.message; }
    },

    get p() { return this.params[this.split]; },
    get currentPhase() { return this.cfg.phases.find(p => p.index === this.phase); },
    // Datasets of the phase that have a manifest for the chosen set.
    get datasetOptions() {
      const key = this.split === 'train' ? 'train_jsonl' : 'valid_jsonl';
      return Object.keys(this.currentPhase.mix).filter(n => this.cfg.datasets[n][key]);
    },
    get effectiveMix() {
      if (!this.cfg) return [];
      const names = this.dataset ? [this.dataset] : this.datasetOptions;
      const weights = names.map(n => this.dataset ? 1 : this.currentPhase.mix[n]);
      const total = weights.reduce((a, b) => a + b, 0);
      return total > 0 ? names.map((n, i) => [n, weights[i] / total]) : [];
    },
    // Size of the manifests the current selection would load.
    get manifestBytes() {
      if (!this.cfg) return 0;
      const key = this.split === 'train' ? 'train_bytes' : 'valid_bytes';
      return this.effectiveMix.reduce((sum, [n]) => sum + (this.cfg.datasets[n][key] || 0), 0);
    },
    get bigManifest() { return this.manifestBytes > this.cfg.large_manifest_bytes; },
    fmtBytes(n) {
      if (n == null) return '';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return n.toFixed(i ? 1 : 0) + ' ' + units[i];
    },
    get dirty() { return this.loadedSpec !== JSON.stringify(this.spec()); },

    phaseLabel(p) {
      if (!this.cfg.is_curriculum) return '0 · single dataset';
      const mix = Object.entries(p.mix).map(([n, w]) => `${n} ${(w * 100).toFixed(0)}%`).join(', ');
      return `${p.index} · ${p.steps} steps · ${mix}`;
    },
    pickDataset() { if (this.dataset && !this.datasetOptions.includes(this.dataset)) this.dataset = ''; },
    resetParams() { this.params[this.split] = clone(this.cfg.defaults[this.split]); },
    spec() {
      return {phase: this.phase, split: this.split, dataset: this.dataset || null, params: this.p};
    },

    async next(reload) {
      this.loading = true; this.error = '';
      const spec = this.spec();
      try {
        const r = await fetch('/api/next', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({spec, skip: Number(this.skip) || 0, reload}),
        });
        const body = await r.json();
        if (!r.ok) {
          const d = body.detail;
          throw new Error(Array.isArray(d) ? d.map(x => `${x.loc.slice(1).join('.')}: ${x.msg}`).join('\n') : d);
        }
        this.batch = body;
        this.loadedSpec = JSON.stringify(spec);
      } catch (e) {
        this.error = e.message;
        this.loadedSpec = null; // the server dropped its loader on an error
      } finally { this.loading = false; }
    },

    codepoints(piece) {
      return [...piece].map(c => 'U+' + c.codePointAt(0).toString(16).toUpperCase().padStart(4, '0')).join(' ');
    },
    // Pieces made only of Hebrew points / cantillation marks (optionally after the ▁ word start).
    markOnly(sample) {
      return sample.pieces.filter(p => /^\u2581?[\u0591-\u05BD\u05BF\u05C1\u05C2\u05C4\u05C5\u05C7]+$/.test(p)).length;
    },

    playBoth(i) {
      const a = document.getElementById('p' + i), b = document.getElementById('t' + i);
      document.querySelectorAll('audio').forEach(x => x.pause());
      a.currentTime = 0; b.currentTime = 0;
      a.onended = () => b.play();
      a.play();
    },
  };
}
</script>
</body>
</html>
